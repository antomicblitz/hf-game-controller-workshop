<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">Exact-six controller wiring</title>
  <desc id="desc">Six normally-open buttons connect Feather pins D5, D6, D9, D10, D11, and D12 to a common ground rail.</desc>
  <style>
    text { font: 16px system-ui, sans-serif; fill: #172033; }
    .title { font-size: 25px; font-weight: 700; }
    .board { fill: #eaf4ff; stroke: #27658f; stroke-width: 3; }
    .button { fill: #fff4d6; stroke: #a56300; stroke-width: 2; }
    .action { fill: #e9e4ff; stroke: #6046a8; }
    .signal { stroke: #27658f; stroke-width: 3; }
    .ground { stroke: #2457b2; stroke-width: 7; }
  </style>
  <text x="40" y="42" class="title">Six buttons → Feather GPIO + common GND</text>
  <rect x="405" y="75" width="220" height="350" rx="22" class="board"/>
  <text x="450" y="110" font-weight="700">Feather nRF52840</text>
  <text x="457" y="140">USB faces left</text>
  <line x1="690" y1="440" x2="940" y2="440" class="ground"/>
  <text x="735" y="475">blue GND rail</text>
  <line x1="625" y1="390" x2="690" y2="440" class="ground"/>
  <text x="565" y="405">GND</text>
  <g>
    <rect x="30" y="80" width="160" height="48" rx="12" class="button"/><text x="75" y="111">Up</text>
    <line x1="190" y1="104" x2="405" y2="104" class="signal"/><text x="345" y="96">D5</text>
    <line x1="110" y1="128" x2="690" y2="440" class="ground"/>
    <rect x="30" y="150" width="160" height="48" rx="12" class="button"/><text x="65" y="181">Down</text>
    <line x1="190" y1="174" x2="405" y2="174" class="signal"/><text x="345" y="166">D6</text>
    <line x1="110" y1="198" x2="690" y2="440" class="ground"/>
    <rect x="30" y="220" width="160" height="48" rx="12" class="button"/><text x="65" y="251">Right</text>
    <line x1="190" y1="244" x2="405" y2="244" class="signal"/><text x="345" y="236">D9</text>
    <line x1="110" y1="268" x2="690" y2="440" class="ground"/>
    <rect x="30" y="290" width="160" height="48" rx="12" class="button"/><text x="70" y="321">Left</text>
    <line x1="190" y1="314" x2="405" y2="314" class="signal"/><text x="335" y="306">D10</text>
    <line x1="110" y1="338" x2="690" y2="440" class="ground"/>
  </g>
  <g>
    <rect x="760" y="115" width="170" height="55" rx="20" class="button action"/><text x="805" y="149">Action A</text>
    <line x1="625" y1="143" x2="760" y2="143" class="signal"/><text x="650" y="134">D11</text>
    <line x1="845" y1="170" x2="845" y2="440" class="ground"/>
    <rect x="760" y="230" width="170" height="55" rx="20" class="button action"/><text x="805" y="264">Action B</text>
    <line x1="625" y1="258" x2="760" y2="258" class="signal"/><text x="650" y="249">D12</text>
    <line x1="880" y1="285" x2="880" y2="440" class="ground"/>
  </g>
</svg>
