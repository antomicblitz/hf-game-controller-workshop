name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap libseccomp2 libcairo2
      - name: Install macOS system packages
        if: runner.os == 'macOS'
        run: brew install cairo
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Validate
        run: make validate
